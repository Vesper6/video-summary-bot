[package]
name = "video-summary-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "视频总结工具：yt-dlp 下载字幕 + Claude AI 分析"
license = "MIT"
repository = "https://github.com/Vesper6/video-summary-bot"
homepage = "https://github.com/Vesper6/video-summary-bot"
readme = "README.md"
keywords = ["video", "summary", "claude", "yt-dlp", "cli"]
categories = ["command-line-utilities", "multimedia::video"]
authors = ["Vesper6 <your.email@example.com>"]

[[bin]]
name = "video-summary-bot"
path = "src/main.rs"

[lib]
name = "video_summary_bot"
path = "src/lib.rs"

# =============================================
# 全平台通用依赖
# =============================================
[dependencies]

# 异步运行时
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "process"] }
futures = "0.3"
async-trait = "0.1"

# HTTP 客户端（axum 服务端和 reqwest 客户端都依赖 hyper）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tao = { version = "0.30", optional = true, default-features = true }
wry = { version = "0.47", optional = true, default-features = true }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# CLI 框架
clap = { version = "4.5", features = ["derive", "env"] }

# 配置
config = { version = "0.14", default-features = false, features = ["toml", "yaml"] }
dotenvy = "0.15"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 时间
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# 进度条
indicatif = "0.17"

# 正则
regex = "1.10"

# URL 解析
url = "2.5"

# 文件系统
walkdir = "2.5"
tempfile = "3.13"

# 并发原语
parking_lot = "0.12"

# 编码（多模态图片用）
base64 = "0.22"

# =============================================
# Feature flags
# =============================================
[features]
# 平台默认特性
default = []

# 启用 HTTP API
api = []

# 启用桌面 GUI（原生窗口，tao + wry WebView2）
gui = ["dep:tao", "dep:wry"]

# =============================================
# 开发依赖
# =============================================
[dev-dependencies]
tokio-test = "0.4"
mockito = "1.4"
pretty_assertions = "1.4"
tempfile = "3.13"
proptest = "1.4"

# =============================================
# 构建优化
# =============================================
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1
incremental = true